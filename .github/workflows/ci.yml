name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bundled Chromium
        run: npx playwright install chromium

      - name: Validate extension
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run isolated Chromium tests
        run: npm run test:e2e

      - name: Upload Chromium failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-traces
          path: test-results/
          if-no-files-found: ignore

      - name: Build distributable ZIP
        run: npm run package

      - name: Upload distributable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: proxy-profiles-switcher
          path: dist/*.zip
          if-no-files-found: error
