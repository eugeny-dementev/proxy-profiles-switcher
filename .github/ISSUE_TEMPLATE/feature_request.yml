name: Feature request
description: Propose an improvement within the local-first profile model.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repeated workflow or limitation should be improved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This can work without credentials, telemetry, host permissions, or remote services.
          required: true
        - label: This preserves explicit user control over proxy activation.
          required: true
